<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Ayni</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar común -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-ayni">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="index.html">
        <span class="brand-mark"><i class="bi bi-people-fill"></i></span> Ayni
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Buscar trabajo</a></li>
          <li class="nav-item"><a class="nav-link" href="publicar.html">Ofrecer mi servicio</a></li>
        </ul>
        <div class="d-flex gap-2 py-2 py-lg-0">
          <a href="login.html" class="btn btn-outline-light btn-sm">Ingresar</a>
          <a href="registro.html" class="btn btn-light btn-sm fw-semibold">Registrarme</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <h1 class="h2 fw-bold">Ingresar</h1>
        <p class="text-secondary">Entra con tu correo para contactar o publicar.</p>

        <form id="form-login" class="card-ayni shadow-sm p-4" novalidate>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="email">Correo</label>
            <input id="email" class="form-control" type="email" placeholder="tucorreo@ejemplo.com" required>
            <div class="invalid-feedback">Escribe un correo válido.</div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="clave">Contraseña</label>
            <input id="clave" class="form-control" type="password" required>
            <div class="invalid-feedback">Escribe tu contraseña.</div>
          </div>
          <button class="btn btn-ayni w-100" type="submit">Ingresar</button>
          <div id="ok" class="alert alert-success mt-3 mb-0 d-none">Sesión iniciada. <a href="index.html">Ir al catálogo</a></div>
        </form>

        <p class="text-center mt-3 mb-0">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
